---
# ------------------------------------------------------------------
# Web Server Verification (Nginx or Apache)
# ------------------------------------------------------------------
- name: Verify HTTP port 80 is listening
  ansible.builtin.wait_for:
    port: 80
    state: started
    timeout: 5

- name: Determine active web service name
  ansible.builtin.set_fact:
    active_web_service: >-
      {{ 'nginx.service' if 'nginx.service' in ansible_facts.services
         else ('apache2.service' if 'apache2.service' in ansible_facts.services
         else 'none') }}

- name: Assert at least one supported web service is detected
  ansible.builtin.assert:
    that:
      - active_web_service != 'none'
    fail_msg: Neither Nginx nor Apache service was detected on target host

- name: Assert web service is active and enabled
  ansible.builtin.assert:
    that:
      - ansible_facts.services[active_web_service].state == 'running'
      - ansible_facts.services[active_web_service].status == 'enabled'
    fail_msg: "{{ active_web_service }} is not active or not enabled"

- name: Test local HTTP response and headers
  ansible.builtin.uri:
    url: http://localhost:80
    method: GET
    return_content: true
  register: http_response

- name: Assert HTTP response status and content headers
  ansible.builtin.assert:
    that:
      - http_response.status == 200
      - "'text/html' in http_response.content_type"
      - http_response.content | length > 0
    fail_msg: HTTP health check failed or returned invalid response
    success_msg: "Web server is responding with HTTP 200 OK (Content-Type: {{ http_response.content_type }})"
