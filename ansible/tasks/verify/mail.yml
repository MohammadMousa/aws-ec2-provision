---
- name: Populate service facts (if not already done)
  ansible.builtin.service_facts:
- name: Assert Postfix package is installed
  ansible.builtin.package_facts:
    manager: apt

- name: Postfix binary exists
  ansible.builtin.assert:
    that: "'postfix' in ansible_facts.packages"
    fail_msg: Postfix package is not installed
    success_msg: Postfix package installed

- name: Assert Postfix service is running and enabled
  ansible.builtin.assert:
    that:
      - "'postfix.service' in ansible_facts.services"
      - ansible_facts.services['postfix.service'].state == 'running'
      - ansible_facts.services['postfix.service'].status == 'enabled'
    fail_msg: Postfix service is not running/enabled
    success_msg: Postfix service is running and enabled

- name: Send test mail and wait for delivery
  ansible.builtin.shell: |
    echo "Ansible verification test mail at $(date)" | mail -s "Verify Postfix" root
    for i in $(seq 1 10); do
      if [ -s /var/mail/root ]; then
        break
      fi
      sleep 1
    done
    cat /var/mail/root
  register: mail_test
  changed_when: false

- name: Assert test mail was delivered to root
  ansible.builtin.assert:
    that:
      - "'Verify Postfix' in mail_test.stdout"
      - "'Ansible verification test mail' in mail_test.stdout"
    fail_msg: Test mail was not delivered to /var/mail/root
    success_msg: Local mail delivery verified
