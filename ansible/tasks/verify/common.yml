---
# ------------------------------------------------------------------
# OS & System Baseline Checks
# ------------------------------------------------------------------
- name: Verify operating system family is Debian/Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
    fail_msg: Expected Debian/Ubuntu, but target host is {{ ansible_os_family }}
    success_msg: "OS family verified: {{ ansible_distribution }} {{ ansible_distribution_version }}"
