---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Deploy index.html from template
  ansible.builtin.template:
    src: nginx-index.html.j2
    dest: /var/www/html/index.html
    mode: '0644'
  notify: Restart nginx

- name: Ensure Nginx is running and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
