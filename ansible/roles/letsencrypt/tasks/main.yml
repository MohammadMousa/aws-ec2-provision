---
- name: Let's Encrypt certificate provisioning
  when: letsencrypt_enabled
  block:
    - name: Fail fast if no domains are configured
      ansible.builtin.fail:
        msg: letsencrypt_domains must contain at least one domain that resolves to this host
      when: letsencrypt_domains | length == 0

    - name: Install certbot
      ansible.builtin.apt:
        name: certbot
        state: present
        update_cache: true

    - name: Ensure UFW allows HTTPS (443/tcp)
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Ensure ACME challenge webroot directory exists
      ansible.builtin.file:
        path: /var/www/certbot
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      when: letsencrypt_webserver == 'nginx'

    - name: Check whether a certificate already exists for the primary domain
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ letsencrypt_domains[0] }}/fullchain.pem
      register: letsencrypt_cert_file

    - name: Deploy nginx site config (Ansible-owned — certbot never edits this file)
      ansible.builtin.template:
        src: nginx_site.conf.j2
        dest: /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: "0644"
      vars:
        cert_exists: "{{ letsencrypt_cert_file.stat.exists }}"
      when: letsencrypt_webserver == 'nginx'

    - name: Ensure sites-enabled/default is a symlink to sites-available/default
      ansible.builtin.file:
        src: /etc/nginx/sites-available/default
        dest: /etc/nginx/sites-enabled/default
        state: link
        force: true
      when: letsencrypt_webserver == 'nginx'

    - name: Confirm nginx config is valid
      ansible.builtin.command: nginx -t
      changed_when: false
      when: letsencrypt_webserver == 'nginx'

    - name: Reload nginx so the ACME challenge path is live before requesting a cert
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      when: letsencrypt_webserver == 'nginx'

    - name: Build the certbot domain argument list
      ansible.builtin.set_fact:
        letsencrypt_domain_args: "{{ letsencrypt_domains | map('regex_replace', '^(.*)$', '-d \\1') | join(' ') }}"

    - name: Obtain certificate via certbot (webroot mode — never touches web server config)
      ansible.builtin.command: >
        certbot certonly --webroot -w /var/www/certbot -n --agree-tos
        --email {{ letsencrypt_email }}
        {{ letsencrypt_domain_args }}
        {{ '--staging' if letsencrypt_staging else '' }}
      when: not letsencrypt_cert_file.stat.exists
      register: letsencrypt_certbot_result
      changed_when: "'Congratulations' in letsencrypt_certbot_result.stdout or 'Successfully received certificate' in letsencrypt_certbot_result.stdout"

    - name: Re-deploy nginx site config now that the cert exists, to add the HTTPS block
      ansible.builtin.template:
        src: nginx_site.conf.j2
        dest: /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: "0644"
      vars:
        cert_exists: true
      when: letsencrypt_webserver == 'nginx' and letsencrypt_certbot_result is changed
      notify: Reload webserver

    - name: Ensure the certbot renewal timer is enabled and running
      ansible.builtin.systemd:
        name: certbot.timer
        enabled: true
        state: started

    - name: Install deploy hook to reload the web server after renewal
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-webserver.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          systemctl reload {{ letsencrypt_webserver }}
