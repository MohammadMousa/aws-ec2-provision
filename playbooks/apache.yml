---
- name: Install and configure Apache
  hosts: webservers
  become: yes

  tasks:
    - name: Install apache2
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Copy custom index.html
      ansible.builtin.copy:
        src: index.html       # Ansible looks in files/ by default
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
      notify: restart apache

  handlers:
    - name: restart apache
      ansible.builtin.service:
        name: apache2
        state: restarted
